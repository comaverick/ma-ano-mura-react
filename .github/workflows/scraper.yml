name: Daily DA and SM Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
      PUPPETEER_CACHE_DIR: /home/runner/.cache/puppeteer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: ./scraper

      # ========================================
      # INSTALL CHROME FOR PUPPETEER
      # ========================================

      - name: Install Chrome
        run: |
          node - <<'NODE'
          const puppeteer = require("puppeteer");
          const { install } = require("@puppeteer/browsers");

          const buildId = puppeteer.browserVersion;

          console.log("Puppeteer version:", require("puppeteer/package.json").version);
          console.log("Required Chrome:", buildId);
          console.log("Cache directory:", process.env.PUPPETEER_CACHE_DIR);

          install({
            browser: "chrome",
            buildId: buildId,
            cacheDir: process.env.PUPPETEER_CACHE_DIR
          })
            .then(() => {
              console.log("Chrome installation complete.");
            })
            .catch((error) => {
              console.error("Chrome installation failed:");
              console.error(error);
              process.exit(1);
            });
          NODE
        working-directory: ./scraper

      # ========================================
      # VERIFY CHROME
      # ========================================

      - name: Verify Chrome
        run: |
          node - <<'NODE'
          const puppeteer = require("puppeteer");

          console.log("Puppeteer version:");
          console.log(require("puppeteer/package.json").version);

          console.log("Required Chrome:");
          console.log(puppeteer.browserVersion);

          console.log("Chrome executable:");
          console.log(puppeteer.executablePath());

          const fs = require("fs");

          if (!fs.existsSync(puppeteer.executablePath())) {
            console.error("Chrome executable does NOT exist.");
            process.exit(1);
          }

          console.log("✓ Chrome executable exists.");
          NODE
        working-directory: ./scraper

      # ========================================
      # SM SUPERMARKETS
      # ========================================

      - name: Scrape SM products
        run: node scrapeSM.js
        working-directory: ./scraper

      - name: Filter SM products
        run: node filterSM.js
        working-directory: ./scraper

      - name: Match SM products
        run: node matchSM.js
        working-directory: ./scraper

      - name: Normalize SM prices
        run: node normalizeSM.js
        working-directory: ./scraper

      - name: Get best SM prices
        run: node getBestSMPrices.js
        working-directory: ./scraper

      - name: Insert SM prices
        run: node insertSMPrices.js
        working-directory: ./scraper