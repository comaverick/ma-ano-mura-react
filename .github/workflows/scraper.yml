name: Daily NCR ingredient prices

on:
  schedule:
    # 00:00 Asia/Manila, every day (GitHub cron uses UTC).
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-ingredient-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
      # Optional: use this when database RLS restricts catalog/price writes.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_OUTPUT_DIR: ${{ runner.temp }}/ingredient-prices
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
        working-directory: scraper
      - name: Check matching, quantities, and source parsers
        run: npm test
        working-directory: scraper
      - name: Collect and update both sources independently
        run: npm run daily
        working-directory: scraper
      - name: Audit recipe pricing coverage
        if: always()
        run: npm run coverage
        working-directory: scraper
      - name: Save source quotes and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingredient-price-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/ingredient-prices
          retention-days: 14
          if-no-files-found: warn
