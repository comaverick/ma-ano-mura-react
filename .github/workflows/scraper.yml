name: Daily NCR ingredient prices

on:
  schedule:
    # 00:00 Asia/Manila, every day (GitHub cron uses UTC).
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ingredient-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
      # Optional: use this when database RLS restricts catalog/price writes.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Configure report directory
        run: echo "SCRAPER_OUTPUT_DIR=$RUNNER_TEMP/ingredient-prices" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
        working-directory: scraper
      - name: Ensure official DA PDF text extraction is available
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
      - name: Check matching, quantities, and source parsers
        run: npm test
        working-directory: scraper
      - name: Restore last healthy coverage baseline
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pricing-baseline
          key: pricing-coverage-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pricing-coverage-v1-
      - name: Collect and update both sources independently
        run: npm run daily
        working-directory: scraper
      - name: Audit recipe pricing coverage
        if: always()
        id: quality
        run: npm run coverage -- --baseline=${{ runner.temp }}/pricing-baseline/coverage.json
        working-directory: scraper
      - name: Export package offers and source evidence
        if: always()
        id: snapshot
        run: node scraper/exportMarketSnapshot.js
      - name: Publish package offers without rebuilding the app
        if: always() && steps.snapshot.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scraper/publishMarketSnapshot.js "$SCRAPER_OUTPUT_DIR/public/market.json"
      - name: Prepare healthy coverage baseline
        if: success()
        run: |
          mkdir -p "${{ runner.temp }}/pricing-baseline"
          cp "$SCRAPER_OUTPUT_DIR/reports/coverage.json" "${{ runner.temp }}/pricing-baseline/coverage.json"
      - name: Save healthy coverage baseline
        continue-on-error: true
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pricing-baseline
          key: pricing-coverage-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save source quotes and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingredient-price-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/ingredient-prices
          retention-days: 14
          if-no-files-found: warn
