name: Daily DA and SM Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --foreground-scripts
        working-directory: ./scraper

      - name: Check Puppeteer Chrome
        run: node -e "const puppeteer=require('puppeteer'); console.log('Chrome:', puppeteer.executablePath())"
        working-directory: ./scraper

      - name: Scrape SM products
        run: node scrapeSM.js
        working-directory: ./scraper

      - name: Filter SM products
        run: node filterSM.js
        working-directory: ./scraper

      - name: Match SM products
        run: node matchSM.js
        working-directory: ./scraper

      - name: Normalize SM prices
        run: node normalizeSM.js
        working-directory: ./scraper

      - name: Get best SM prices
        run: node getBestSMPrices.js
        working-directory: ./scraper

      - name: Insert SM prices
        run: node insertSMPrices.js
        working-directory: ./scraper