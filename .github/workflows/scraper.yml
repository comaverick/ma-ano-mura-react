name: Daily DA and SM Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
      PUPPETEER_CACHE_DIR: /home/runner/.cache/puppeteer

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # NODE.JS
      # =========================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # INSTALL DEPENDENCIES
      # =========================

      - name: Install dependencies
        run: npm install
        working-directory: ./scraper

      # =========================
      # INSTALL CHROME
      # =========================

      - name: Install Chrome for Puppeteer
        run: |
          node - <<'NODE'
          const { install } = require("@puppeteer/browsers");

          const buildId = "147.0.7727.57";
          const cacheDir = process.env.PUPPETEER_CACHE_DIR;

          console.log("Installing Chrome...");
          console.log("Chrome version:", buildId);
          console.log("Cache:", cacheDir);

          install({
            browser: "chrome",
            buildId: buildId,
            cacheDir: cacheDir
          })
            .then(() => {
              console.log("✓ Chrome installation complete");
            })
            .catch((error) => {
              console.error("❌ Chrome installation failed");
              console.error(error);
              process.exit(1);
            });
          NODE
        working-directory: ./scraper

      # =========================
      # VERIFY CHROME
      # =========================

      - name: Verify Chrome
        run: |
          node - <<'NODE'
          const puppeteer = require("puppeteer");
          const fs = require("fs");

          console.log(
            "Puppeteer:",
            require("puppeteer/package.json").version
          );

          const executable = puppeteer.executablePath();

          console.log("Chrome executable:");
          console.log(executable);

          if (!fs.existsSync(executable)) {
            console.error(
              "❌ Chrome executable does not exist."
            );
            process.exit(1);
          }

          console.log(
            "✓ Chrome executable exists."
          );
          NODE
        working-directory: ./scraper

      # =========================
      # DA BANTAY PRESYO
      # =========================

      - name: Scrape DA products
        run: node scrape.js
        working-directory: ./scraper

      - name: Filter DA products
        run: node filter.js
        working-directory: ./scraper

      - name: Match DA products
        run: node match.js
        working-directory: ./scraper

      - name: Insert DA prices
        run: node insertPrices.js
        working-directory: ./scraper

      # =========================
      # SM SUPERMARKETS
      # =========================

      - name: Scrape SM products
        run: node scrapeSM.js
        working-directory: ./scraper

      - name: Filter SM products
        run: node filterSM.js
        working-directory: ./scraper

      - name: Match SM products
        run: node matchSM.js
        working-directory: ./scraper

      - name: Normalize SM prices
        run: node normalizeSM.js
        working-directory: ./scraper

      - name: Get best SM prices
        run: node getBestSMPrices.js
        working-directory: ./scraper

      - name: Insert SM prices
        run: node insertSMPrices.js
        working-directory: ./scraper